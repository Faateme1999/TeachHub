# Docker Compose for TeachHub's database.
#
# This gives you a real PostgreSQL database with ONE command — no need to install
# Postgres on your machine. Beginners: think of this as "a database in a box".
#
#   Start it:   docker compose up -d
#   Stop it:    docker compose down
#   Wipe it:    docker compose down -v   (also deletes the stored data)
#
# The database is exposed on host port 5433 (not the default 5432) so it won't
# clash with any Postgres you might already have running. The connection string
# in .env must use the SAME port (5433) — see .env.example.

services:
  db:
    image: postgres:16
    container_name: teachhub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: teachhub
      POSTGRES_PASSWORD: teachhub
      POSTGRES_DB: teachhub
    ports:
      - '5433:5432' # host:container — connect to localhost:5433
    volumes:
      - teachhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teachhub']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  teachhub_pgdata:
